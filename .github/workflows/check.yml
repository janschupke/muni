# The full gate, as `pnpm check` runs it locally, against a throwaway Postgres 17 on the
# test database's port and credentials (packages/db/.env.test). Playwright e2e and
# Lighthouse need browsers and the built app; they stay local for now (see README, Checks).
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: muni
          POSTGRES_PASSWORD: muni
          POSTGRES_DB: muni_test
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U muni -d muni_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Git hooks are for local commits.
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm check:schema
      - run: pnpm check:drift
      - run: pnpm coverage
      - run: pnpm build

# The full gate, as `pnpm check` runs it locally, against a throwaway Postgres 17 on the
# test database's port and credentials (packages/db/.env.test); then the browser suites and
# Lighthouse on the production build, signed in as the Clerk e2e users. Clerk's development
# keys come from repository secrets (docs/testing.md, CI), given only to the steps that use
# them. Actions are pinned to commits; Renovate keeps the pins current.
name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # A newer push to a pull request replaces its run; every run on master finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # Git hooks are for local commits.
  LEFTHOOK: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db-test: &db-test
        image: postgres:17-alpine
        env:
          POSTGRES_USER: muni
          POSTGRES_PASSWORD: muni
          POSTGRES_DB: muni_test
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U muni -d muni_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      # Fails at once, naming the secrets, rather than in a build or a server that cannot start.
      - &clerk-keys
        name: Clerk development keys are set
        env:
          PUBLISHABLE: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          SECRET: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          case "$PUBLISHABLE:$SECRET" in
            pk_test_*:sk_test_*) ;;
            *)
              echo "::error::Set the repository secrets CLERK_PUBLISHABLE_KEY (pk_test_…) and CLERK_SECRET_KEY (sk_test_…) to the Clerk development instance's keys (docs/testing.md, CI)."
              exit 1
              ;;
          esac
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm's version comes from package.json's packageManager field.
      - &pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - &install
        run: pnpm install --frozen-lockfile
      # Known vulnerabilities in what ships (not the dev tools).
      - run: pnpm audit --prod --audit-level high
      # Exactly what `pnpm check` runs locally; its build inlines the publishable key.
      - run: pnpm check
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db-test: *db-test
    steps:
      - *clerk-keys
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm --filter @muni/web exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      # The specs (readers side by side, writers on their own server), then Lighthouse alone:
      # its scores need a quiet machine. Each run seeds the test databases and signs the e2e
      # users in, with the secret key.
      - run: pnpm test:e2e
        env: &clerk
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      - run: pnpm test:lighthouse
        env: *clerk
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

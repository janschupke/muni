packages:
  - apps/*
  - packages/*

# Every external version is pinned here once; packages reference it as "catalog:".
catalog:
  '@clerk/localizations': 4.23.0
  '@clerk/nextjs': 7.9.16
  '@eslint/js': 10.0.1
  '@next/eslint-plugin-next': 16.4.2
  '@playwright/test': 1.64.1
  '@prisma/adapter-pg': 7.10.1
  '@prisma/client': 7.10.1
  '@tailwindcss/postcss': 4.3.3
  '@tanstack/react-table': 9.3.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.8
  '@types/luxon': 3.7.6
  '@types/node': 26.6.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  dotenv-cli: 11.0.0
  eslint: 10.12.0
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.13.0
  jsdom: 30.1.3
  knip: 6.41.0
  lucide-react: 1.58.0
  luxon: 3.7.2
  next: 16.4.2
  next-intl: 4.14.9
  prettier: 3.9.10
  prettier-plugin-tailwindcss: 0.8.1
  prisma: 7.10.1
  radix-ui: 1.8.1
  react: 19.3.1
  react-dom: 19.3.1
  server-only: 0.0.1
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tsx: 4.23.15
  turbo: 2.11.8
  typescript: 6.0.3
  typescript-eslint: 8.71.2
  vitest: 5.0.5
  zod: 4.6.7

# Dependencies with install scripts must be listed explicitly; an unlisted one fails the install.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@clerk/shared': true
  '@parcel/watcher': true
  '@swc/core': true

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - vitest@5.0.5
  - '@next/eslint-plugin-next@16.4.2'
  - '@prisma/adapter-pg@7.10.1'
  - '@prisma/client-runtime-utils@7.10.1'
  - '@prisma/client@7.10.1'
  - '@prisma/config@7.10.1'
  - '@prisma/debug@7.10.1'
  - '@prisma/driver-adapter-utils@7.10.1'
  - '@prisma/engines@7.10.1'
  - '@prisma/fetch-engine@7.10.1'
  - '@prisma/get-platform@7.10.1'
  - prisma@7.10.1
  - lucide-react@1.58.0
  - '@clerk/backend@3.24.0'
  - '@clerk/nextjs@7.9.16'
  - '@next/env@16.4.2'
  - '@next/swc-darwin-arm64@16.4.2'
  - '@next/swc-darwin-x64@16.4.2'
  - '@next/swc-linux-arm64-gnu@16.4.2'
  - '@next/swc-linux-arm64-musl@16.4.2'
  - '@next/swc-linux-x64-gnu@16.4.2'

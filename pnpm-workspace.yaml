packages:
  - apps/*
  - packages/*

# Every external version is pinned here once; packages reference it as "catalog:".
catalog:
  '@clerk/backend': 3.24.0
  '@clerk/localizations': 4.23.0
  '@clerk/nextjs': 7.9.16
  '@clerk/testing': 2.2.42
  '@eslint-community/eslint-plugin-eslint-comments': 4.8.1
  '@eslint-react/eslint-plugin': 5.28.0
  '@eslint/js': 10.0.1
  '@next/eslint-plugin-next': 16.4.2
  '@playwright/test': 1.64.1
  '@prisma/adapter-pg': 7.10.1
  '@prisma/client': 7.10.1
  '@tailwindcss/postcss': 4.3.3
  '@tanstack/react-query': 5.104.2
  '@tanstack/react-table': 9.3.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.8
  '@types/luxon': 3.7.6
  # The Node the app runs on (24: .nvmrc, engines), not the newest.
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  '@vitest/coverage-v8': 5.0.5
  '@vitest/eslint-plugin': 1.6.27
  axe-core: 4.13.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  dotenv-cli: 11.0.0
  eslint: 10.12.0
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-import-x: 4.17.1
  eslint-plugin-jsx-a11y-x: 0.2.0
  eslint-plugin-playwright: 2.12.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-simple-import-sort: 14.0.0
  globals: 17.13.0
  intl-messageformat: 11.2.15
  jsdom: 30.1.3
  knip: 6.41.0
  lefthook: 2.1.16
  lighthouse: 13.5.0
  lucide-react: 1.58.0
  luxon: 3.7.2
  next: 16.4.2
  next-intl: 4.14.9
  prettier: 3.9.10
  prettier-plugin-tailwindcss: 0.8.1
  prisma: 7.10.1
  radix-ui: 1.8.1
  react: 19.3.1
  react-dom: 19.3.1
  server-only: 0.0.1
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tsx: 4.23.15
  turbo: 2.11.8
  typescript: 6.0.3
  typescript-eslint: 8.71.2
  vitest: 5.0.5
  zod: 4.6.7

# Dependencies with install scripts must be listed explicitly; an unlisted one fails the install.
allowBuilds:
  # Installed by the `prepare` script instead of its own postinstall.
  lefthook: false
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@clerk/shared': true
  '@parcel/watcher': true
  '@swc/core': true

# A release is installed only once it is a day old: a compromised version is usually caught
# and pulled within hours. Set here, it is strict: an immature version fails the install
# instead of being let through and listed.
minimumReleaseAge: 1440

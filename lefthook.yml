# A commit runs fast checks on the staged files only; a push runs the checks for everything it
# carries (scripts/check-changed.ts). `pnpm check` (and CI) is the full gate.
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

    # Each package lints with its own config, so each runs from its own root.
    - name: eslint web
      root: apps/web/
      glob: '*.{ts,tsx,js,mjs}'
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}
    - name: eslint db
      root: packages/db/
      glob: '*.{ts,js}'
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}
    - name: eslint domain
      root: packages/domain/
      glob: '*.{ts,js}'
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}
    - name: eslint importer
      root: packages/importer/
      glob: '*.{ts,js}'
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}
    - name: eslint ui
      root: packages/ui/
      glob: '*.{ts,tsx,js}'
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}
    - name: eslint utils
      root: packages/utils/
      glob: '*.{ts,js}'
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}
    - name: eslint root
      glob: '*.{ts,js}'
      exclude:
        - 'apps/**'
        - 'packages/**'
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}

pre-push:
  jobs:
    # Since the upstream (or origin/master): typecheck, the related tests and the path rules of
    # .ai/rules/gates.md. With nothing to compare with, it says so and passes.
    - name: checks for what is pushed
      run: node scripts/check-changed.ts --base auto

# Local Postgres. Supabase runs Postgres 17, so dev and test match the production major version.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: muni
      POSTGRES_PASSWORD: muni
      POSTGRES_DB: muni
    ports:
      - '5438:5432'
    volumes:
      - muni-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U muni -d muni']
      interval: 2s
      timeout: 3s
      retries: 30

  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: muni
      POSTGRES_PASSWORD: muni
      POSTGRES_DB: muni_test
    ports:
      - '5439:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U muni -d muni_test']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  muni-db:
